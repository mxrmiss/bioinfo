# =========================
# RNA-seq 流程配置（最新版）
# 说明：
# - 默认在项目根 rna-seq/ 下运行 scripts/* 脚本
# - 路径全部使用相对路径，便于跨机器迁移
# - 仅产“原材料”与表格，不做任何绘图
# =========================

paths:
  # —— 原始与参考 —— 
  fastq_dir:    data/fastp                 # 原始 FASTQ 根目录（01 会在此下按 samples.tsv 中的相对路径取文件）
  ref_fasta:    ref/Sinonovacula_constricta_genome.fa
  ref_gtf:      ref/Sinonovacula_constricta_genome.gff3

  # —— 索引与映射关系 —— 
  salmon_index: results/refprep/salmon_index  # 02 生成的 gentrome+decoys 索引目录
  tx2gene:      ref/tx2gene.geneMap.tsv       # 05 使用的转录本→基因映射表（由 03/07 脚本生成或人工提供）

  # —— 过程产物 —— 
  clean_dir:    results/qc/clean              # 01 清洗后 FASTQ 输出目录
  quant_dir:    results/quant                 # 04 salmon 定量结果目录
  matrix_dir:   results/matrix                # 05 tximport 聚合矩阵目录
  deg_dir:      results/deg                   # 06 DEG 结果目录
  enrich_dir:   results/enrich                # 08 富集结果目录
  publish_dir:  results/publish               # 09 发布（XLSX/汇总）目录

  # —— 注释目录（07/07b/KEGG 名称）——
  anno_dir:     ref/annotations               # 07 输出 gene2go/gene2ko/gene2pathway；07b 输出 go_terms.tsv；KEGG 名称表 kegg_pathway.tsv

  # —— 其它 —— 
  logs_dir:     logs
  tmp_dir:      tmp

tables:
  samples:   data/samples.tsv                 # 必含列：sample, group, fastq1, fastq2（fastq2 可空）
  contrasts: data/contrasts.tsv               # 必含列：contrast, case, control（如 D15_vs_D0, D15, D0）
  emapper:   ref/annotations/Sinonovacula_constricta_annotations.tsv  # emapper 注释原始 TSV（07 读取）

binaries:
  fastp:     fastp
  cutadapt:  cutadapt
  salmon:    salmon
  rscript:   Rscript

resources:
  threads:
    qc:            20
    salmon_index:  20
    quant:         20
    deg:           20
    enrich:        10
    publish:       4
  mem_gb:
    qc:     90
    quant:  90
    deg:    90
    enrich: 32
    publish: 8

# ========== 质控（01）==========
qc:
  min_read_len: 30        # 过滤后最短读长
  trim_quality: 20        # 末端截短阈值（Phred）

# ========== Salmon（02/04） ==========
salmon:
  libType: "A"            # Salmon 自动推断
  use_geneMap: true       # Salmon quant 后续 tximport summarizeToGene
  keep_duplicates: false  # 建索引阶段是否保留重复转录本（与 02 一致；gentrome 模式默认 false）

# ========== Tximport 聚合（05） ==========
tximport:
  filter_low_expr: false  # 不在 05 里做低表达过滤（保留完整矩阵，筛选下放到 DEG/富集）
  ignore_tx_version: true # tx2gene 若含 ".1" 之类版本号时允许忽略（与 05_R 实现一致）

# ========== 差异分析（06） ==========
deg:
  alpha: 0.05             # FDR 阈值
  lfc: 1.0                # |log2FC| 阈值，仅用于“sig”标记与富集的 All/Up/Down 切分
  transform: "vst"        # vst|rlog；仅影响下游可选的矩阵导出（不做绘图）

# ========== 注释准备（07 / 07b） ==========
go_local:
  # 07b（go_local.R）导出范围控制：FALSE=仅导出 gene2go.tsv 中出现的 GO（推荐）；TRUE=导出 GO.db 全量
  export_all: false

# ========== 富集分析（08） ==========
enrich:
  input: deg               # 或 lists
  source: emapper_only     # 仅使用 emapper 产生的 GO/Pathway 集合
  pval_cutoff: 0.05
  p_adjust: "BH"           # 多重校正方法：BH | BY | holm | hochberg | hommel | bonferroni | fdr | none
  min_set_size: 10         # 过滤太小集合
  max_set_size: 500        # 过滤太大集合
  # QC 打印（仅检查，不强行拦截）
  qc:
    min_pathway_coverage: 0.70
    min_deg_with_pathway: 30

# ========== 发布（09） ==========
publish:
  excel_workbook: true     # 09 是否汇总为 XLSX（不影响 TSV 原材料输出）
  include_salmon_cov: true # 汇入 salmon 覆盖度（来自 results/quant/summary.tsv）
  # 统一列名口径（英文）
  columns:
    term_id:     "set_id"
    term_name:   "term_name"
    overlap:     "overlap"
    set_size:    "set_size"
    pvalue:      "pvalue"
    padj:        "padj"
    bg_size:     "bg_size"
    sig_size:    "sig_size"
    hit_in_set:  "hit_in_set"
    hit_in_sig:  "hit_in_sig"
    gene_ratio:  "gene_ratio"
    bg_ratio:    "bg_ratio"

# ========== 异常策略 ==========
policy:
  on_qc_fail: "abort"      # abort|warn（质控关键项失败时是否终止）

